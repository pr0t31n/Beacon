<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Beacon — Login</title>
<style>
:root {
  --bg: #0d1117;
  --bg-card: #161b22;
  --border: #30363d;
  --fg: #c9d1d9;
  --fg-dim: #8b949e;
  --fg-bright: #f0f6fc;
  --accent: #58a6ff;
  --error: #E7716F;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
  font-size: 14px;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
}
.login-box {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 32px;
  width: 320px;
}
.login-box h1 {
  font-size: 16px;
  font-weight: 600;
  color: var(--fg-bright);
  letter-spacing: 2px;
  text-transform: uppercase;
  text-align: center;
  margin-bottom: 24px;
}
.field { margin-bottom: 16px; }
.field label {
  display: block;
  font-size: 12px;
  color: var(--fg-dim);
  margin-bottom: 4px;
}
.field input {
  width: 100%;
  padding: 8px 10px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 4px;
  color: var(--fg);
  font-size: 14px;
}
.field input:focus { outline: none; border-color: var(--accent); }
.btn {
  width: 100%;
  padding: 8px;
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: 4px;
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
}
.btn:hover { opacity: 0.9; }
.error {
  background: rgba(231,113,111,.15);
  border: 1px solid rgba(231,113,111,.35);
  color: var(--error);
  padding: 8px 10px;
  border-radius: 4px;
  font-size: 13px;
  margin-bottom: 16px;
}
</style>
</head>
<body>
<div class="login-box">
  <h1>Beacon</h1>
  {% if error %}
  <div class="error">{{ error }}</div>
  {% endif %}
  <form method="POST" action="/auth/login">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <div class="field">
      <label>Username</label>
      <input type="text" name="username" autofocus required>
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" name="password" required>
    </div>
    <button type="submit" class="btn">Sign In</button>
  </form>
</div>
</body>
</html>
