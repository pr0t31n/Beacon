<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard</title>
<style>
:root {
  --bg: #0d1117;
  --bg-card: #161b22;
  --border: #30363d;
  --fg: #c9d1d9;
  --fg-dim: #8b949e;
  --fg-bright: #f0f6fc;
  --accent: #58a6ff;
  --risk-critical: #FF00FF;
  --risk-high: #E7716F;
  --risk-medium: #FFC000;
  --risk-low: #92D050;
  --risk-info: #BDD7EC;
  --status-running: #58a6ff;
  --status-complete: #3fb950;
  --status-failed: #E7716F;
  --status-queued: #8b949e;
  --status-idle: #484f58;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
  font-size: 14px;
  line-height: 1.5;
}
a { color: var(--accent); text-decoration: none; }

/* Header */
.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 20px;
  border-bottom: 1px solid var(--border);
  background: var(--bg-card);
}
.header h1 {
  font-size: 16px;
  font-weight: 600;
  color: var(--fg-bright);
  letter-spacing: 2px;
  text-transform: uppercase;
}
.header .meta {
  display: flex;
  align-items: center;
  gap: 16px;
  font-size: 12px;
  color: var(--fg-dim);
}
.header .meta a { font-size: 12px; }

/* Main */
.main { padding: 20px; max-width: 960px; margin: 0 auto; }

/* Cards */
.card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 16px 20px;
  margin-bottom: 12px;
}
.card-header {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  margin-bottom: 8px;
}
.card-title {
  font-size: 15px;
  font-weight: 600;
  color: var(--fg-bright);
}
.card-status {
  font-size: 12px;
  font-weight: 500;
}
.card-status.active { color: var(--status-complete); }
.card-meta {
  font-size: 12px;
  color: var(--fg-dim);
  margin-bottom: 10px;
}

/* Risk pills */
.risk-bar {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
  margin-bottom: 10px;
}
.risk-pill {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 8px;
  border-radius: 4px;
  font-size: 12px;
  font-weight: 600;
  border: 1px solid;
}
.risk-pill.critical {
  color: var(--risk-critical);
  background: rgba(255,0,255,.15);
  border-color: rgba(255,0,255,.35);
}
.risk-pill.high {
  color: var(--risk-high);
  background: rgba(231,113,111,.15);
  border-color: rgba(231,113,111,.35);
}
.risk-pill.medium {
  color: var(--risk-medium);
  background: rgba(255,192,0,.15);
  border-color: rgba(255,192,0,.35);
}
.risk-pill.low {
  color: var(--risk-low);
  background: rgba(146,208,80,.15);
  border-color: rgba(146,208,80,.35);
}
.risk-pill.info {
  color: var(--risk-info);
  background: rgba(189,215,236,.12);
  border-color: rgba(189,215,236,.25);
}
.risk-total {
  font-size: 12px;
  color: var(--fg-dim);
  margin-left: 4px;
}

/* Tool table */
.tool-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}
.tool-table td {
  padding: 3px 8px 3px 0;
  vertical-align: top;
  white-space: nowrap;
}
.tool-table td:first-child { width: 20px; }
.tool-table .tool-name { color: var(--fg-bright); font-weight: 500; }
.tool-table .tool-status { color: var(--fg-dim); }
.tool-table .tool-time { color: var(--fg-dim); font-size: 12px; }
.tool-table .tool-ver { color: var(--fg-dim); font-size: 11px; }

.status-icon { font-size: 12px; }
.status-icon.complete { color: var(--status-complete); }
.status-icon.running { color: var(--status-running); }
.status-icon.failed { color: var(--status-failed); }
.status-icon.queued { color: var(--status-queued); }
.status-icon.idle { color: var(--status-idle); }

/* Empty state */
.empty {
  text-align: center;
  padding: 60px 20px;
  color: var(--fg-dim);
}
.empty h2 { font-size: 16px; margin-bottom: 4px; color: var(--fg); }

/* Delete btn */
.btn-delete {
  background: none;
  border: 1px solid var(--border);
  color: var(--fg-dim);
  padding: 2px 8px;
  border-radius: 4px;
  cursor: pointer;
  font-size: 11px;
}
.btn-delete:hover { border-color: var(--status-failed); color: var(--status-failed); }

/* Refresh indicator */
.refresh-dot {
  display: inline-block;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--status-complete);
  margin-right: 4px;
  animation: pulse 2s infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.3; }
}

/* Section headers */
.section-header {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 24px 0 12px 0;
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  color: var(--fg-dim);
}
.section-header:first-child { margin-top: 0; }
.section-line {
  flex: 1;
  height: 1px;
  background: var(--border);
}

/* Provider badge */
.provider-badge {
  display: inline-block;
  padding: 1px 6px;
  border-radius: 3px;
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  background: rgba(88,166,255,.15);
  color: var(--accent);
  border: 1px solid rgba(88,166,255,.25);
  margin-left: 6px;
}

/* Progress bar */
.progress-wrap {
  width: 100%;
  height: 4px;
  background: var(--border);
  border-radius: 2px;
  margin: 6px 0 2px 0;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  border-radius: 2px;
  background: var(--status-running);
  transition: width 0.4s ease;
}
.progress-fill.complete { background: var(--status-complete); }
.progress-fill.failed { background: var(--status-failed); }

/* Webhook task rows */
.wh-task {
  padding: 6px 0;
  border-bottom: 1px solid rgba(48,54,61,.5);
}
.wh-task:last-child { border-bottom: none; }
.wh-task-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
.wh-task-name {
  font-size: 13px;
  font-weight: 500;
  color: var(--fg-bright);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  flex: 1;
}
.wh-task-status {
  font-size: 12px;
  white-space: nowrap;
}
.wh-task-msg {
  font-size: 12px;
  color: var(--fg-dim);
  margin-top: 2px;
}
.wh-task-meta {
  font-size: 11px;
  color: var(--fg-dim);
  margin-top: 2px;
}
</style>
</head>
<body>
<div class="header">
  <h1>Dashboard</h1>
  <div class="meta">
    <span><span class="refresh-dot"></span>Live</span>
    
    <a href="/auth/change-password">Settings</a>
    <a href="/auth/logout">Logout</a>
  </div>
</div>
<div class="main" id="app">
  <div id="engagements-section"></div>
  <div id="webhooks-section"></div>
  <div class="empty" id="empty-state">
    <h2>No active sources</h2>
    <p>Waiting for Crucible or webhook connections...</p>
  </div>
</div>
<script>
(function() {
  var engSection = document.getElementById('engagements-section');
  var whSection = document.getElementById('webhooks-section');
  var emptyEl = document.getElementById('empty-state');
  var STATUS_ICONS = {
    complete: {sym: '✓', cls: 'complete'},
    running:  {sym: '►', cls: 'running'},
    failed:   {sym: '✗', cls: 'failed'},
    error:    {sym: '✗', cls: 'failed'},
    queued:   {sym: '◷', cls: 'queued'},
    idle:     {sym: '—', cls: 'idle'},
    paused:   {sym: '‖', cls: 'queued'},
    cancelled:{sym: '✗', cls: 'failed'},
    unknown:  {sym: '?', cls: 'idle'},
  };

  function fmtTime(iso) {
    if (!iso) return '—';
    try {
      var d = new Date(iso);
      return d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit', hour12: false});
    } catch(e) { return iso; }
  }

  function fmtDateTime(iso) {
    if (!iso) return '—';
    try {
      var d = new Date(iso);
      return d.toLocaleDateString([], {year:'numeric', month:'2-digit', day:'2-digit'}) +
             ' ' + d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit', second:'2-digit', hour12: false});
    } catch(e) { return iso; }
  }

  function relativeTime(iso) {
    if (!iso) return '—';
    try {
      var d = new Date(iso);
      var secs = Math.floor((Date.now() - d.getTime()) / 1000);
      if (secs < 0) secs = 0;
      if (secs >= 86400) return fmtDateTime(iso);
      if (secs < 60) return secs + 's ago';
      if (secs < 3600) return Math.floor(secs/60) + 'm ' + (secs%60) + 's ago';
      return Math.floor(secs/3600) + 'h ' + Math.floor((secs%3600)/60) + 'm ago';
    } catch(e) { return iso; }
  }

  function _esc(s) {
    var d = document.createElement('div');
    d.textContent = s || '';
    return d.innerHTML;
  }

  function renderRisk(findings) {
    if (!findings) return '';
    var levels = ['critical','high','medium','low','info'];
    var keys = ['CRITICAL','HIGH','MEDIUM','LOW','INFO'];
    var total = 0;
    var pills = '';
    for (var i = 0; i < levels.length; i++) {
      var n = findings[keys[i]] || 0;
      total += n;
      if (n > 0) {
        pills += '<span class="risk-pill ' + levels[i] + '">' +
                 keys[i][0] + ':' + n + '</span>';
      }
    }
    if (!pills) return '';
    return '<div class="risk-bar">' + pills +
           '<span class="risk-total">Total: ' + total + '</span></div>';
  }

  function _sectionHeader(text) {
    return '<div class="section-header"><span>' + _esc(text) +
           '</span><span class="section-line"></span></div>';
  }

  // ── Engagement rendering ──

  function _toolName(tid) {
    var NAMES = {
      ss3:'Scattershot3', fracture:'Fracture', siphon:'Siphon',
      osift:'OSift', isotope:'Isotope', bastion:'Bastion',
      gearbox:'Gearbox', authprobe:'AuthProbe', quill:'Quill',
      forge:'Forge', dredge:'Dredge', auger:'Auger', trawler:'Trawler',
      nessus:'Nessus', pain:'pAIn'
    };
    var parts = tid.split(':');
    var base = parts[0];
    var scope = parts.length > 1 ? parts.slice(1).join(':') : '';
    var name = NAMES[base] || base.charAt(0).toUpperCase() + base.slice(1);
    return scope ? name + ' [' + scope + ']' : name;
  }

  function renderTools(tools, queue) {
    var rows = [];
    if (tools && typeof tools === 'object') {
      var ids = Object.keys(tools).sort(function(a,b) {
        var order = {running:0, queued:1, paused:2, idle:3, complete:4, failed:5, error:5};
        var oa = order[tools[a].status] !== undefined ? order[tools[a].status] : 9;
        var ob = order[tools[b].status] !== undefined ? order[tools[b].status] : 9;
        return oa - ob;
      });
      for (var i = 0; i < ids.length; i++) {
        var tid = ids[i];
        var t = tools[tid];
        var st = t.status || 'idle';
        var ic = STATUS_ICONS[st] || STATUS_ICONS.idle;
        var timeStr = fmtTime(t.started_at);
        if (t.ended_at) timeStr += '–' + fmtTime(t.ended_at);
        else if (st === 'running') timeStr += '–';
        var ver = t.tool_version ? 'v' + t.tool_version : '';
        rows.push('<tr>' +
          '<td><span class="status-icon ' + ic.cls + '">' + ic.sym + '</span></td>' +
          '<td class="tool-name">' + _esc(_toolName(tid)) + '</td>' +
          '<td class="tool-status">' + st + '</td>' +
          '<td class="tool-time">' + timeStr + '</td>' +
          '<td class="tool-ver">' + ver + '</td></tr>');
      }
    }
    if (queue && queue.length) {
      for (var j = 0; j < queue.length; j++) {
        var q = queue[j];
        rows.push('<tr>' +
          '<td><span class="status-icon queued">◷</span></td>' +
          '<td class="tool-name">' + _esc(_toolName(q.tool_id || '')) + '</td>' +
          '<td class="tool-status">queued</td>' +
          '<td class="tool-time">pri:' + (q.priority || 0) + '</td>' +
          '<td class="tool-ver"></td></tr>');
      }
    }
    if (!rows.length) return '<div style="color:var(--fg-dim);font-size:12px;">No tools reported</div>';
    return '<table class="tool-table">' + rows.join('') + '</table>';
  }

  function renderEngCard(eng) {
    var snap = eng.snapshot || {};
    var html = '<div class="card" data-id="' + _esc(eng.id) + '" data-type="eng">';
    html += '<div class="card-header">';
    html += '<span class="card-title">' + _esc(eng.client_name || '') +
            (eng.client_name && eng.name ? ' — ' : '') +
            _esc(eng.name || '') + '</span>';
    html += '<span class="card-status active">● ACTIVE</span>';
    html += ' <button class="btn-delete" onclick="deleteEng(\'' + _esc(eng.id) + '\')">Delete</button>';
    html += '</div>';
    html += '<div class="card-meta">';
    html += 'Started: ' + fmtDateTime(eng.start_date);
    if (eng.end_date) html += '&nbsp;&nbsp;Ended: ' + fmtDateTime(eng.end_date);
    html += '&nbsp;&nbsp;Last update: <span class="last-seen" data-iso="' + _esc(eng.last_seen || '') + '">' + relativeTime(eng.last_seen) + '</span>';
    var srcParts = [];
    if (eng.source_hostname) srcParts.push(_esc(eng.source_hostname));
    if (eng.source_ip) srcParts.push(_esc(eng.source_ip));
    if (srcParts.length) html += '&nbsp;&nbsp;Source: ' + srcParts.join(' (') + (srcParts.length > 1 ? ')' : '');
    html += '</div>';
    html += renderRisk(snap.findings);
    html += renderTools(snap.tools, snap.queue);
    html += '</div>';
    return html;
  }

  // ── Webhook source rendering ──

  function renderProgress(progress, status) {
    if (progress === null || progress === undefined) return '';
    var pct = Math.min(100, Math.max(0, Math.round(progress * 100)));
    var cls = status === 'complete' ? ' complete' : status === 'failed' ? ' failed' : '';
    return '<div class="progress-wrap"><div class="progress-fill' + cls +
           '" style="width:' + pct + '%"></div></div>';
  }

  function renderWhTask(task) {
    var st = task.status || 'unknown';
    var ic = STATUS_ICONS[st] || STATUS_ICONS.unknown;
    var html = '<div class="wh-task">';
    html += '<div class="wh-task-header">';
    html += '<span class="status-icon ' + ic.cls + '">' + ic.sym + '</span>&nbsp;';
    html += '<span class="wh-task-name">' + _esc(task.task_name || task.id) + '</span>';
    html += '<span class="wh-task-status" style="color:var(--status-' + ic.cls + ')">' + st + '</span>';
    html += '</div>';
    if (st === 'running' || task.progress !== null && task.progress !== undefined) {
      html += renderProgress(task.progress, st);
    }
    if (task.message) {
      html += '<div class="wh-task-msg">' + _esc(task.message) + '</div>';
    }
    html += renderRisk(task.findings_summary);
    var meta = [];
    if (task.started_at) meta.push('Started: ' + fmtTime(task.started_at));
    if (task.ended_at) meta.push('Ended: ' + fmtTime(task.ended_at));
    meta.push('Updated: <span class="last-seen" data-iso="' + _esc(task.last_updated || '') + '">' +
              relativeTime(task.last_updated) + '</span>');
    if (meta.length) {
      html += '<div class="wh-task-meta">' + meta.join('&nbsp;&nbsp;') + '</div>';
    }
    html += '</div>';
    return html;
  }

  function renderWhCard(src) {
    var html = '<div class="card" data-id="' + _esc(src.id) + '" data-type="wh">';
    html += '<div class="card-header">';
    html += '<span class="card-title">' + _esc(src.name) +
            '<span class="provider-badge">' + _esc(src.provider_name || src.provider) + '</span></span>';
    var hasRunning = (src.tasks || []).some(function(t) { return t.status === 'running'; });
    html += '<span class="card-status' + (hasRunning ? ' active' : '') + '">' +
            (hasRunning ? '● ACTIVE' : '○ IDLE') + '</span>';
    html += ' <button class="btn-delete" onclick="deleteWh(\'' + _esc(src.id) + '\')">Delete</button>';
    html += '</div>';
    html += '<div class="card-meta">';
    if (src.source_ip) html += 'Source: ' + _esc(src.source_ip) + '&nbsp;&nbsp;';
    html += 'Last update: <span class="last-seen" data-iso="' + _esc(src.last_seen || '') + '">' +
            relativeTime(src.last_seen) + '</span>';
    html += '&nbsp;&nbsp;Tasks: ' + (src.tasks || []).length;
    html += '</div>';
    var tasks = src.tasks || [];
    for (var i = 0; i < tasks.length; i++) {
      html += renderWhTask(tasks[i]);
    }
    if (!tasks.length) {
      html += '<div style="color:var(--fg-dim);font-size:12px;padding:4px 0;">No tasks reported</div>';
    }
    html += '</div>';
    return html;
  }

  // ── Refresh logic ──

  function refresh() {
    return Promise.all([
      fetch('/api/engagements', {credentials: 'same-origin'}).then(function(r) {
        if (r.status === 401) { window.location.href = '/auth/login'; return null; }
        return r.ok ? r.json() : [];
      }),
      fetch('/api/webhook_sources', {credentials: 'same-origin'}).then(function(r) {
        return r.ok ? r.json() : [];
      })
    ]).then(function(results) {
      var engs = results[0];
      var sources = results[1];
      if (engs === null) return;

      var hasContent = (engs && engs.length) || (sources && sources.length);
      emptyEl.style.display = hasContent ? 'none' : '';

      // Engagements
      var engHtml = '';
      if (engs && engs.length) {
        engHtml = _sectionHeader('Engagements');
        for (var i = 0; i < engs.length; i++) engHtml += renderEngCard(engs[i]);
      }
      engSection.innerHTML = engHtml;

      // Webhook sources
      var whHtml = '';
      if (sources && sources.length) {
        whHtml = _sectionHeader('External Tools');
        for (var j = 0; j < sources.length; j++) whHtml += renderWhCard(sources[j]);
      }
      whSection.innerHTML = whHtml;
    }).catch(function(e) { console.error('refresh:', e); });
  }

  window.deleteEng = function(id) {
    if (!confirm('Delete this engagement? This cannot be undone.')) return;
    fetch('/api/engagement/' + encodeURIComponent(id), {
      method: 'DELETE', credentials: 'same-origin'
    })
    .then(function(r) { return r.json(); })
    .then(function() { refresh(); })
    .catch(function(e) { console.error('delete:', e); });
  };

  window.deleteWh = function(id) {
    if (!confirm('Delete this webhook source? This cannot be undone.')) return;
    fetch('/api/webhook_source/' + encodeURIComponent(id), {
      method: 'DELETE', credentials: 'same-origin'
    })
    .then(function(r) { return r.json(); })
    .then(function() { refresh(); })
    .catch(function(e) { console.error('delete:', e); });
  };

  function tickLastSeen() {
    var spans = document.querySelectorAll('.last-seen[data-iso]');
    for (var i = 0; i < spans.length; i++) {
      spans[i].textContent = relativeTime(spans[i].getAttribute('data-iso'));
    }
  }

  refresh();
  var _refreshTimer = null;
  function scheduleRefresh() {
    _refreshTimer = setTimeout(function() {
      refresh().then(scheduleRefresh).catch(scheduleRefresh);
    }, 60000);
  }
  scheduleRefresh();
  setInterval(tickLastSeen, 10000);
  document.addEventListener('visibilitychange', function() {
    if (!document.hidden) {
      refresh();
      if (_refreshTimer) clearTimeout(_refreshTimer);
      scheduleRefresh();
    }
  });
})();
</script>
</body>
</html>
